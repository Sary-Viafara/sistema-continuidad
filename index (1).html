<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Continuidad</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15151a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Continuidad">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f5f3; --card:#ffffff; --text:#1c1c1c; --muted:#6b6b6b;
  --accent:#2b6cb0; --accent2:#c05621; --border:#e2e0db; --danger:#c53030; --ok:#2f855a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15151a; --card:#1f1f26; --text:#eceae6; --muted:#9b9b9b;
    --accent:#6ea8e0; --accent2:#e08a52; --border:#30303a;
  }
}
:root[data-theme="dark"]{
  --bg:#15151a; --card:#1f1f26; --text:#eceae6; --muted:#9b9b9b;
  --accent:#6ea8e0; --accent2:#e08a52; --border:#30303a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
header{position:sticky; top:0; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;
  background:var(--bg); border-bottom:1px solid var(--border); z-index:5;}
h1{font-size:1.1rem; margin:0 0 10px; letter-spacing:.2px;}
nav{display:flex; gap:6px; overflow-x:auto;}
nav button{flex:none; padding:7px 12px; border-radius:20px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:.85rem; cursor:pointer;}
nav button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
main{padding:14px 16px 90px; max-width:640px; margin:0 auto;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-bottom:12px;}
.card h3{margin:0 0 4px; font-size:1rem;}
.meta{font-size:.78rem; color:var(--muted); margin:2px 0;}
.tag{display:inline-block; font-size:.7rem; padding:2px 8px; border-radius:10px;
  background:var(--border); color:var(--text); margin-right:6px;}
.tag.today{background:var(--danger); color:#fff;}
.tag.soon{background:var(--accent2); color:#fff;}
.tag.ok{background:var(--ok); color:#fff;}
.empty{color:var(--muted); font-size:.9rem; text-align:center; padding:30px 10px;}
label{display:block; font-size:.78rem; color:var(--muted); margin:10px 0 4px;}
input,select,textarea{width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:.9rem; font-family:inherit;}
textarea{min-height:52px; resize:vertical;}
.row{display:flex; gap:8px;}
.row>div{flex:1;}
.btn{padding:9px 14px; border-radius:9px; border:none; background:var(--accent); color:#fff;
  font-size:.88rem; cursor:pointer; margin-top:12px;}
.btn.secondary{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn.danger{background:transparent; border:1px solid var(--danger); color:var(--danger);}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}
.log{border-left:2px solid var(--border); padding-left:10px; margin-top:8px;}
.log .field{font-size:.84rem; margin-bottom:4px;}
.log .field b{color:var(--muted); font-weight:600;}
.chip-select{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
.chip-select span{padding:6px 10px; border:1px solid var(--border); border-radius:16px; font-size:.82rem; cursor:pointer;}
.chip-select span.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
.saved-note{position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:7px 14px; border-radius:20px; font-size:.8rem;
  opacity:0; transition:opacity .25s; pointer-events:none;}
.saved-note.show{opacity:.92;}
</style>
</head>
<body>
<header>
  <h1>🧭 Sistema de Continuidad</h1>
  <nav>
    <button data-tab="regreso" class="active">Pantalla de Regreso</button>
    <button data-tab="procesos">Procesos</button>
    <button data-tab="registro">Registro</button>
  </nav>
</header>
<main id="main"></main>
<div class="saved-note" id="savedNote">Guardado</div>

<script>
const SEED = { procesos: [], registros: [] };
let state = null;
let artifactApi = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysDiff(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00'); const t = new Date(todayISO()+'T00:00:00');
  return Math.round((d-t)/86400000);
}

const LOCAL_KEY = 'continuidad-state-v1';

function loadEmbeddedState(){
  try{
    const ls = localStorage.getItem(LOCAL_KEY);
    if(ls) return JSON.parse(ls);
  }catch(e){}
  const el = document.getElementById('app-state');
  if(el){ try{ return JSON.parse(el.textContent); }catch(e){} }
  return JSON.parse(JSON.stringify(SEED));
}

async function persist(){
  const note = document.getElementById('savedNote');
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }catch(e){}
  if(artifactApi){
    try{
      const html = buildFullHTML();
      const res = await artifactApi.publish(html);
      if(res && res.conflict){ return; }
    }catch(e){}
  }
  note.classList.add('show');
  setTimeout(()=>note.classList.remove('show'), 1200);
}

function buildFullHTML(){
  const doc = document.documentElement.cloneNode(true);
  let stateTag = doc.querySelector('#app-state');
  if(!stateTag){
    stateTag = document.createElement('script');
    stateTag.type = 'application/json';
    stateTag.id = 'app-state';
    doc.querySelector('body').appendChild(stateTag);
  }
  stateTag.textContent = JSON.stringify(state);
  return '<!DOCTYPE html>\n' + doc.outerHTML;
}

let activeTab = 'regreso';

function setTab(tab){
  activeTab = tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
}

function statusTag(iso){
  const d = daysDiff(iso);
  if(d===null) return '';
  if(d<0) return '<span class="tag today">atrasado '+Math.abs(d)+'d</span>';
  if(d===0) return '<span class="tag today">hoy</span>';
  if(d<=3) return '<span class="tag soon">en '+d+'d</span>';
  return '<span class="tag ok">en '+d+'d</span>';
}

function renderRegreso(){
  const procesos = [...state.procesos].sort((a,b)=>{
    const da = a.proximaRevision ? new Date(a.proximaRevision) : new Date('2999-01-01');
    const db_ = b.proximaRevision ? new Date(b.proximaRevision) : new Date('2999-01-01');
    return da-db_;
  });
  if(procesos.length===0){
    return '<div class="empty">No tienes procesos activos aún.<br>Ve a "Procesos" y agrega el primero.</div>';
  }
  return procesos.map(p=>{
    const last = state.registros.filter(r=>r.procesoId===p.id).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    return `<div class="card">
      <h3>${esc(p.nombre)}</h3>
      <div class="meta">${esc(p.area||'')} ${statusTag(p.proximaRevision)}</div>
      <div class="meta"><b>Etapa actual:</b> ${esc(p.etapa||'—')}</div>
      <div class="meta"><b>Siguiente paso:</b> ${esc(p.siguiente||'—')}</div>
      <div class="meta"><b>Última actividad:</b> ${esc(p.ultimaActividad||'—')}</div>
      ${last ? `<div class="meta" style="margin-top:6px;"><b>Última sesión (${esc(last.fecha)}):</b> quedé en "${esc(last.quedeEn||'')}"</div>` : ''}
      <div class="btn-row">
        <button class="btn secondary" onclick="goLog('${p.id}')">Registrar sesión</button>
        <button class="btn secondary" onclick="goEdit('${p.id}')">Editar</button>
      </div>
    </div>`;
  }).join('');
}

function renderProcesos(){
  let html = '<div class="card"><h3>Nuevo proceso</h3>' + procesoForm(null) + '</div>';
  html += state.procesos.map(p=>`<div class="card">
    <h3>${esc(p.nombre)}</h3>
    <div class="meta">${esc(p.area||'')}</div>
    <div class="btn-row">
      <button class="btn secondary" onclick="goEdit('${p.id}')">Editar</button>
      <button class="btn danger" onclick="deleteProceso('${p.id}')">Eliminar</button>
    </div>
  </div>`).join('');
  return html;
}

function procesoForm(p){
  const v = p || {nombre:'',area:'',etapa:'',siguiente:'',ultimaActividad:'',proximaRevision:todayISO(),ritmo:'Flexible'};
  const id = p ? p.id : '';
  return `<form onsubmit="saveProceso(event,'${id}')">
    <label>Nombre</label><input name="nombre" required value="${attr(v.nombre)}">
    <label>Área</label><input name="area" value="${attr(v.area)}" placeholder="ej. Programación">
    <label>Etapa actual</label><textarea name="etapa">${esc(v.etapa)}</textarea>
    <label>Siguiente paso</label><textarea name="siguiente">${esc(v.siguiente)}</textarea>
    <div class="row">
      <div><label>Última actividad</label><input type="date" name="ultimaActividad" value="${attr(v.ultimaActividad)}"></div>
      <div><label>Próxima revisión</label><input type="date" name="proximaRevision" value="${attr(v.proximaRevision)}"></div>
    </div>
    <label>Ritmo</label>
    <select name="ritmo">
      ${['Diario','3x semana','Semanal','Flexible'].map(r=>`<option ${v.ritmo===r?'selected':''}>${r}</option>`).join('')}
    </select>
    <button class="btn" type="submit">${p?'Guardar cambios':'Crear proceso'}</button>
  </form>`;
}

function renderEdit(id){
  const p = state.procesos.find(x=>x.id===id);
  if(!p) return '<div class="empty">Proceso no encontrado.</div>';
  return `<div class="card"><h3>Editar: ${esc(p.nombre)}</h3>${procesoForm(p)}</div>`;
}

function renderRegistro(){
  let html = '<div class="card"><h3>Nueva entrada</h3>';
  if(state.procesos.length===0){
    html += '<div class="empty">Crea un proceso primero.</div></div>';
    return html;
  }
  html += `<form onsubmit="saveRegistro(event)">
    <label>Proceso</label>
    <select name="procesoId" id="regProceso">
      ${state.procesos.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}
    </select>
    <label>Fecha</label><input type="date" name="fecha" value="${todayISO()}">
    <label>Hecho</label><textarea name="hecho" placeholder="Qué terminé en esta sesión"></textarea>
    <label>Aprendí</label><textarea name="aprendi" placeholder="Qué cambió o entendí"></textarea>
    <label>Quedé en</label><textarea name="quedeEn" placeholder="Dónde debo continuar"></textarea>
    <label>Siguiente</label><textarea name="siguiente" placeholder="La próxima acción exacta"></textarea>
    <button class="btn" type="submit">Guardar sesión</button>
  </form></div>`;

  const logs = [...state.registros].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(logs.length){
    html += '<h3 style="margin:14px 2px 4px;font-size:.95rem;">Historial</h3>';
    html += logs.map(r=>{
      const p = state.procesos.find(x=>x.id===r.procesoId);
      return `<div class="card">
        <div class="meta"><b>${esc(p?p.nombre:'—')}</b> · ${esc(r.fecha)}</div>
        <div class="log">
          <div class="field"><b>Hecho:</b> ${esc(r.hecho||'—')}</div>
          <div class="field"><b>Aprendí:</b> ${esc(r.aprendi||'—')}</div>
          <div class="field"><b>Quedé en:</b> ${esc(r.quedeEn||'—')}</div>
          <div class="field"><b>Siguiente:</b> ${esc(r.siguiente||'—')}</div>
        </div>
      </div>`;
    }).join('');
  }
  return html;
}

let editTarget = null;
function goLog(procesoId){ setTab('registro'); setTimeout(()=>{ const s=document.getElementById('regProceso'); if(s) s.value=procesoId; },0); }
function goEdit(id){ editTarget=id; activeTab='edit'; render(); }

function render(){
  const main = document.getElementById('main');
  if(activeTab==='regreso') main.innerHTML = renderRegreso();
  else if(activeTab==='procesos') main.innerHTML = renderProcesos();
  else if(activeTab==='registro') main.innerHTML = renderRegistro();
  else if(activeTab==='edit') main.innerHTML = renderEdit(editTarget);
}

function saveProceso(ev, id){
  ev.preventDefault();
  const f = ev.target;
  const data = {
    nombre: f.nombre.value.trim(),
    area: f.area.value.trim(),
    etapa: f.etapa.value.trim(),
    siguiente: f.siguiente.value.trim(),
    ultimaActividad: f.ultimaActividad.value,
    proximaRevision: f.proximaRevision.value,
    ritmo: f.ritmo.value
  };
  if(id){
    const p = state.procesos.find(x=>x.id===id);
    Object.assign(p, data);
  } else {
    state.procesos.push({id:uid(), ...data});
  }
  persist();
  setTab('regreso');
}

function deleteProceso(id){
  if(!confirm('¿Eliminar este proceso y su historial de sesiones?')) return;
  state.procesos = state.procesos.filter(p=>p.id!==id);
  state.registros = state.registros.filter(r=>r.procesoId!==id);
  persist();
  render();
}

function saveRegistro(ev){
  ev.preventDefault();
  const f = ev.target;
  const procesoId = f.procesoId.value;
  state.registros.push({
    id:uid(), procesoId,
    fecha:f.fecha.value||todayISO(),
    hecho:f.hecho.value.trim(), aprendi:f.aprendi.value.trim(),
    quedeEn:f.quedeEn.value.trim(), siguiente:f.siguiente.value.trim()
  });
  const p = state.procesos.find(x=>x.id===procesoId);
  if(p){
    p.ultimaActividad = f.fecha.value||todayISO();
    if(f.siguiente.value.trim()) p.siguiente = f.siguiente.value.trim();
  }
  persist();
  f.reset();
  render();
}

function esc(s){ return (s||'').toString().replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function attr(s){ return esc(s); }

document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click', ()=>setTab(b.dataset.tab)));

(async function init(){
  state = loadEmbeddedState();
  render();
  try{
    artifactApi = await (window.claude && window.claude.use ? window.claude.use('artifact') : Promise.resolve(null));
  }catch(e){ artifactApi = null; }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
